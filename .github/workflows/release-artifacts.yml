name: Release Artifacts

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      publish_release:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or target release tag, for example 0.7.27.1
        required: false
        type: string
      publish_release:
        description: Publish verified bundles to GitHub Releases
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "features/hap-self-contained-release-*"
    tags:
      - "*.*.*"
      - "*.*.*.*"

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HAP_UPSTREAM_REF: 3dd69816af109d5da2378ee54cedb1311fa12842
  HAP_RELEASE_TAG: nightly-1.3.0-alpha.20260805010019-hap-3dd69816af10
  HAP_RELEASE_BASE: https://github.com/HapPub/Hap/releases/download/nightly-1.3.0-alpha.20260805010019-hap-3dd69816af10
  HAP_RAW_BASE: https://raw.githubusercontent.com/HapPub/Hap/3dd69816af109d5da2378ee54cedb1311fa12842/scripts/ci
  CANGJIE_SDK_MIRROR_BASE: https://github.com/HapPub/CangjieSDK-Mirror/releases/download
  # Keep SDK/stdx resolution on the same verified nightly as the pinned Hap release.
  CANGJIE_SDK_MIRROR_TAG: 1.3.0-alpha.20260805010019
  CANGJIE_STDX_GIT_REF: ${{ vars.CANGJIE_STDX_GIT_REF != '' && vars.CANGJIE_STDX_GIT_REF || 'v1.1.0-beta.25' }}
  CANGJIE_STDX_REPO: ${{ vars.CANGJIE_STDX_REPO != '' && vars.CANGJIE_STDX_REPO || 'https://gitcode.com/Cangjie/cangjie_stdx' }}
  CANGJIE_STDX_RELEASE_VERSION: ${{ vars.CANGJIE_STDX_RELEASE_VERSION }}
  IGNITE_GIT_URL: ${{ vars.IGNITE_GIT_URL != '' && vars.IGNITE_GIT_URL || 'https://gitcode.com/cinyu/ignite-cangjie.git' }}
  LISI_GIT_URL: ${{ vars.LISI_GIT_URL != '' && vars.LISI_GIT_URL || 'https://gitcode.com/cinyu/lisi.git' }}
  JINGUISSL_GIT_URL: ${{ vars.JINGUISSL_GIT_URL != '' && vars.JINGUISSL_GIT_URL || 'https://gitcode.com/cinyu/jinguiSSL.git' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      sdk_tag: ${{ steps.meta.outputs.sdk_tag }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release matrix
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  version = "\(.*\)"/\1/p' cjpm.toml | head -n 1)"
          [[ -n "$version" ]] || { echo 'cjpm.toml version is missing' >&2; exit 1; }
          tag="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF_TYPE:-}" != tag ]]; then
            tag="${{ inputs.release_tag }}"
          fi
          [[ -n "$tag" ]] || tag="$version"
          tag="${tag#v}"
          [[ "$tag" == "$version" || "$tag" == "$version".* ]] || {
            echo "release tag $tag does not match package version $version" >&2
            exit 1
          }
          if [[ -z "${CANGJIE_SDK_MIRROR_TAG}" ]]; then
            curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
              'https://api.github.com/repos/HapPub/CangjieSDK-Mirror/releases?per_page=20' \
              -o "${RUNNER_TEMP}/cangjie-sdk-releases.json"
            CANGJIE_SDK_MIRROR_TAG="$(python3 - "${RUNNER_TEMP}/cangjie-sdk-releases.json" <<'PY'
          import json, sys
          releases = json.load(open(sys.argv[1], encoding='utf-8'))
          release = next((item for item in releases if not item.get('draft')), None)
          if not release:
              raise SystemExit('no published CangjieSDK-Mirror release found')
          print(release['tag_name'])
          PY
            )"
          fi
          publish='false'
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then publish='true'; fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${{ inputs.publish_release }}" == true ]]; then publish='true'; fi
          matrix='{"include":['
          matrix+='{ "runner":"ubuntu-24.04", "target":"x86_64-unknown-linux-gnu", "sdk_platform":"linux-x64", "stdx_platform":"linux-x64", "stdx_alias":"linux_x86_64_llvm", "artifact_platform":"Linux-x86_64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-linux-amd64.tar.gz", "hap_sha256":"5491927c019acdbdd1e65261512d6d00e1351d4ac4e1e293687d24bdb80eb1ea" }'
          matrix+=',{"runner":"ubuntu-24.04-arm", "target":"aarch64-unknown-linux-gnu", "sdk_platform":"linux-aarch64", "stdx_platform":"linux-aarch64", "stdx_alias":"linux_aarch64_llvm", "artifact_platform":"Linux-aarch64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-linux-arm64.tar.gz", "hap_sha256":"71b6856ca8427b473a3d441719b8e26b35172295b0ee7f574041e20b10481ac2" }'
          matrix+=',{"runner":"macos-15-intel", "target":"x86_64-apple-darwin", "sdk_platform":"mac-x64", "stdx_platform":"mac-x64", "stdx_alias":"cj_stdx_darwin_x86_64_llvm", "artifact_platform":"macOS-x86_64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-darwin-amd64.tar.gz", "hap_sha256":"66fdf4ccbd8283b5559a4683ad23d0f4768ed0d32df522eca0e2fd248139df9b" }'
          matrix+=',{"runner":"macos-14", "target":"aarch64-apple-darwin", "sdk_platform":"mac-aarch64", "stdx_platform":"mac-aarch64", "stdx_alias":"cj_stdx_darwin_aarch64_llvm", "artifact_platform":"macOS-aarch64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-darwin-arm64.tar.gz", "hap_sha256":"0257945efeaedd28220edbef5b900de6ac0813373415da585348f43c1a3846e8" }'
          matrix+=',{"runner":"windows-2025", "target":"x86_64-w64-mingw32", "sdk_platform":"windows-x64", "stdx_platform":"windows-x64", "stdx_alias":"windows_x86_64_cjnative", "artifact_platform":"Windows-x86_64-exe", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-windows-amd64.zip", "hap_sha256":"1ae16ae3ed14691c899f4efdd23182f92127e0cb8e4695852fc1ef6ad07f0434" }'
          matrix+=',{"runner":"ubuntu-24.04", "target":"aarch64-linux-ohos", "sdk_platform":"linux-x64-ohos", "stdx_platform":"ohos-aarch64", "stdx_alias":"linux_ohos_aarch64_cjnative", "artifact_platform":"OHOS-aarch64", "runtime_smoke":"link-only", "ohos_arch":"arm64", "hap_asset":"hap-0.1.0-linux-amd64.tar.gz", "hap_sha256":"5491927c019acdbdd1e65261512d6d00e1351d4ac4e1e293687d24bdb80eb1ea" }'
          matrix+=',{"runner":"ubuntu-24.04", "target":"x86_64-linux-ohos", "sdk_platform":"linux-x64-ohos", "stdx_platform":"ohos-x64", "stdx_alias":"linux_ohos_x86_64_cjnative", "artifact_platform":"OHOS-x86_64", "runtime_smoke":"link-only", "ohos_arch":"amd64", "hap_asset":"hap-0.1.0-linux-amd64.tar.gz", "hap_sha256":"5491927c019acdbdd1e65261512d6d00e1351d4ac4e1e293687d24bdb80eb1ea" }'
          matrix+=']}'
          {
            echo "package_version=$version"
            echo "release_tag=$tag"
            echo "publish_release=$publish"
            echo "sdk_tag=$CANGJIE_SDK_MIRROR_TAG"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  bundles:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pinned HapPub/Hap release asset
        id: hap
        shell: bash
        run: |
          set -euo pipefail
          hap_root="${RUNNER_TEMP}/hap"
          hap_archive="${RUNNER_TEMP}/${{ matrix.hap_asset }}"
          mkdir -p "$hap_root"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "${HAP_RELEASE_BASE}/${{ matrix.hap_asset }}" -o "$hap_archive"
          python3 - "${{ matrix.hap_sha256 }}" "$hap_archive" <<'PY'
          import hashlib, pathlib, sys
          expected, path = sys.argv[1:]
          actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Hap release checksum mismatch: expected={expected} actual={actual}")
          PY
          if [[ "$hap_archive" == *.zip ]]; then
            python3 - "$hap_archive" "$hap_root" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
          else
            tar -xzf "$hap_archive" -C "$hap_root"
          fi
          hap_bin="$(find "$hap_root" -type f \( -name hap -o -name hap.exe \) -print -quit)"
          [[ -n "$hap_bin" ]] || { echo 'pinned Hap release did not contain a Hap binary' >&2; exit 1; }
          chmod +x "$hap_bin"
          echo "$(dirname "$hap_bin")" >> "$GITHUB_PATH"
          "$hap_bin" version
          mkdir -p "${RUNNER_TEMP}/receipts"
          python3 - "${RUNNER_TEMP}/receipts/hap-bootstrap.json" "$hap_bin" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema": "soonlink-hap-bootstrap-receipt-v1",
              "ok": True,
              "upstreamCommit": "3dd69816af109d5da2378ee54cedb1311fa12842",
              "releaseTag": "nightly-1.3.0-alpha.20260805010019-hap-3dd69816af10",
              "asset": "${{ matrix.hap_asset }}",
              "sha256": "${{ matrix.hap_sha256 }}",
              "binary": sys.argv[2]
          }, indent=2) + "\n")
          PY
          echo "hap_bin=$hap_bin" >> "$GITHUB_OUTPUT"

      - name: Hap action-doctor (read-only)
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
        run: |
          set -euo pipefail
          "$HAP_BIN" ci action-doctor \
            --workflow .github/workflows/release-artifacts.yml \
            --target "${{ matrix.target }}" | tee "${RUNNER_TEMP}/action-doctor.json"
          python3 - "${RUNNER_TEMP}/action-doctor.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not data.get("ok"):
              raise SystemExit("Hap action-doctor rejected the release workflow")
          PY

      - name: Fetch pinned Hap CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ci_dir="${RUNNER_TEMP}/hap-ci"
          mkdir -p "$ci_dir"
          for script in bootstrap-cangjie-from-mirror.sh resolve-nightly-sdk.py install-cangjie-sdk.sh safe-extract-sdk.py; do
            curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
              "${HAP_RAW_BASE}/${script}" -o "$ci_dir/$script"
          done
          chmod +x "$ci_dir"/*.sh
          echo "ci_dir=$ci_dir" >> "$GITHUB_ENV"

      - name: Resolve target SDK with the mirror manifest
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/manifest.v1.json"
          mkdir -p "${RUNNER_TEMP}/cangjie" "${RUNNER_TEMP}/receipts"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "${CANGJIE_SDK_MIRROR_BASE}/${{ needs.metadata.outputs.sdk_tag }}/manifest.v1.json" \
            -o "$manifest"
          "$ci_dir/bootstrap-cangjie-from-mirror.sh" \
            "$manifest" \
            "${{ matrix.sdk_platform }}" \
            "${RUNNER_TEMP}/cangjie" \
            "${RUNNER_TEMP}/cangjie-env.sh" \
            "${RUNNER_TEMP}/receipts/sdk-resolution.json"
          stdx_asset="$(python3 - "$manifest" "${{ matrix.stdx_platform }}" <<'PY'
          import json, sys
          manifest, platform = sys.argv[1:]
          prefix = f"cangjie-stdx-{platform}-"
          matches = [item["name"] for item in json.load(open(manifest, encoding="utf-8"))["assets"]
                     if item.get("classification") == "stdx" and item["name"].startswith(prefix) and item["name"].endswith(".zip")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one stdx asset for {platform}, got {matches}")
          print(matches[0])
          PY
          )"
          "$ci_dir/resolve-nightly-sdk.py" \
            --manifest "$manifest" \
            --asset-name "$stdx_asset" \
            > "${RUNNER_TEMP}/receipts/stdx-resolution.json"
          cat "${RUNNER_TEMP}/receipts/sdk-resolution.json"
          cat "${RUNNER_TEMP}/receipts/stdx-resolution.json"

      - name: Source generated Cangjie environment
        shell: bash
        run: |
          set -euo pipefail
          # The mirror installer writes cangjie-env.sh; no shell rc is modified.
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          echo "CANGJIE_HOME=$CANGJIE_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Install OpenHarmony native sysroot
        id: ohos
        if: ${{ matrix.runtime_smoke == 'link-only' }}
        uses: openharmony-rs/setup-ohos-sdk@eb82b94ef522b07269679195c2512f22e922ef3b
        with:
          version: "6.1"
          components: native
          cache: "true"
          mirror: "true"

      - name: Install exact stdx asset and prepare OpenHarmony sysroot
        shell: bash
        env:
          DEVECO_CANGJIE_HOME: ${{ steps.ohos.outputs.ohos_sdk_native }}
        run: |
          set -euo pipefail
          stdx_root="${RUNNER_TEMP}/cangjie_stdx"
          stdx_archive="${RUNNER_TEMP}/stdx-${{ matrix.stdx_platform }}.zip"
          mkdir -p "$stdx_root"
          stdx_url="$(python3 - "${RUNNER_TEMP}/receipts/stdx-resolution.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["sdkUrl"])
          PY
          )"
          stdx_sha256="$(python3 - "${RUNNER_TEMP}/receipts/stdx-resolution.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["sdkSha256"])
          PY
          )"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "$stdx_url" -o "$stdx_archive"
          python3 - "$stdx_sha256" "$stdx_archive" <<'PY'
          import hashlib, pathlib, sys
          expected, path = sys.argv[1:]
          actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"stdx checksum mismatch: expected={expected} actual={actual}")
          PY
          python3 "$ci_dir/safe-extract-sdk.py" "$stdx_archive" "$stdx_root"
          python3 - "$stdx_root" "${{ matrix.stdx_alias }}" "${RUNNER_TEMP}/receipts/stdx-install.json" <<'PY'
          import json, pathlib, shutil, sys
          root, alias, receipt = map(pathlib.Path, sys.argv[1:])
          candidates = sorted(path.parent.parent for path in root.glob("*/static/stdx") if path.is_dir())
          if len(candidates) != 1:
              raise SystemExit(f"expected one extracted stdx root, got {candidates}")
          source = candidates[0]
          target = root / alias
          try:
              target.symlink_to(source.name, target_is_directory=True)
          except OSError:
              shutil.copytree(source, target)
          if not (target / "static" / "stdx").is_dir():
              raise SystemExit(f"stdx alias is incomplete: {target}")
          pathlib.Path(receipt).write_text(json.dumps({
              "schema": "soonlink-stdx-install-receipt-v1",
              "ok": True,
              "sourceRoot": str(source),
              "alias": str(target),
              "target": "${{ matrix.target }}",
              "manifestSelected": True
          }, indent=2) + "\n")
          PY
          echo "CANGJIE_STDX_PATH=$stdx_root" >> "$GITHUB_ENV"
          if [[ "${{ matrix.runtime_smoke }}" == link-only ]]; then
            [[ -d "${DEVECO_CANGJIE_HOME:-}" ]] || { echo 'OpenHarmony native sysroot is required' >&2; exit 1; }
            echo "DEVECO_CANGJIE_HOME=$DEVECO_CANGJIE_HOME" >> "$GITHUB_ENV"
          fi

      - name: Install native packaging tools
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends patchelf unzip zip

      - name: Run Hap stdx/runtime probes
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/receipts"
          "$HAP_BIN" doctor stdx --project . --target "${{ matrix.target }}" > "${RUNNER_TEMP}/receipts/stdx-probe.json"
          "$HAP_BIN" doctor runtime --project . --target "${{ matrix.target }}" > "${RUNNER_TEMP}/receipts/runtime-probe.json"

      - name: Generate and execute reviewed Hap project bridge
        if: ${{ matrix.runtime_smoke == 'native' }}
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
          HAP_REVIEW_TOKEN: reviewed-${{ github.sha }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          # The reviewed bridge executes the fixed cjpm build and cjpm test commands.
          echo 'reviewed Hap bridge contract: cjpm build; cjpm test'
          "$HAP_BIN" ci project-bridge-recipe \
            --project . \
            --receipt "${RUNNER_TEMP}/receipts/project-bridge.json" \
            --recipe-output "${RUNNER_TEMP}/project-bridge.sh" \
            --run-tests \
            --review-token "$HAP_REVIEW_TOKEN" > "${RUNNER_TEMP}/receipts/project-bridge-plan.json"
          chmod +x "${RUNNER_TEMP}/project-bridge.sh"
          bridge_log="${RUNNER_TEMP}/receipts/project-bridge.log"
          set +e
          bash "${RUNNER_TEMP}/project-bridge.sh" 2>&1 | tee "$bridge_log"
          bridge_status=${PIPESTATUS[0]}
          set -e
          if [[ "$bridge_status" -ne 0 ]]; then
            python3 - "$bridge_log" <<'PY'
          import pathlib, sys
          tail = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-4000:]
          message = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink project bridge failed::{message}")
          PY
            exit "$bridge_status"
          fi

      - name: Record OHOS test boundary
        if: ${{ matrix.runtime_smoke == 'link-only' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/receipts/project-bridge.json" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema": "soonlink-cross-test-boundary-receipt-v1",
              "ok": True,
              "target": sys.argv[2],
              "buildActionTaken": False,
              "testActionTaken": False,
              "status": "runtime-test-not-available-on-hosted-cross-runner",
              "nonClaims": ["OHOS link proof is not target runtime test proof"]
          }, indent=2) + "\n")
          PY

      - name: Build exact target with Hap
        id: build
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
        run: |
          set -euo pipefail
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          "$HAP_BIN" build --project . --target "${{ matrix.target }}" > "${RUNNER_TEMP}/receipts/hap-build.json"
          python3 - "${RUNNER_TEMP}/receipts/hap-build.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not data.get("ok"):
              raise SystemExit("Hap exact-target build receipt is not successful")
          PY

      - name: Package binary and WebPanel together
        id: package
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          binary="target/release/bin/main"
          if [[ "${{ matrix.target }}" == *-w64-mingw32 ]]; then binary="target/release/bin/main.exe"; fi
          if [[ "${{ matrix.runtime_smoke }}" == link-only ]]; then binary="target/${{ matrix.target }}/release/bin/main"; fi
          [[ -f "$binary" ]] || { echo "target binary not found: $binary" >&2; exit 1; }
          chmod +x ./scripts/ci/package_release_bundle.sh
          ./scripts/ci/package_release_bundle.sh \
            --root . \
            --binary "$binary" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.metadata.outputs.package_version }}" \
            --output-dir "${RUNNER_TEMP}/release-bundles" \
            --runtime-root "${CANGJIE_HOME}"
          mkdir -p "${RUNNER_TEMP}/receipts"
          python3 - "${RUNNER_TEMP}/receipts/package-receipt.json" "${RUNNER_TEMP}/release-bundles" <<'PY'
          import hashlib, json, pathlib, sys
          receipt, directory = map(pathlib.Path, sys.argv[1:])
          archives = sorted(directory.glob("*.zip")) + sorted(directory.glob("*.tar.gz"))
          if len(archives) != 2:
              raise SystemExit("package did not produce one zip and one tar.gz")
          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""): h.update(chunk)
              return h.hexdigest()
          payload = {"schema":"soonlink-package-receipt-v1", "ok":True, "target":"${{ matrix.target }}", "archives":[{"name":p.name,"sha256":sha(p)} for p in archives], "webpanelIncluded":True}
          receipt.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Native runtime smoke or OHOS link-only proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/receipts"
          if [[ "${{ matrix.runtime_smoke }}" == native ]]; then
            archive="$(find "${RUNNER_TEMP}/release-bundles" -name '*.zip' -maxdepth 1 | head -n 1)"
            smoke="${RUNNER_TEMP}/runtime-smoke"
            rm -rf "$smoke"; mkdir -p "$smoke"
            if [[ "${{ matrix.target }}" == *-w64-mingw32 ]]; then
              python3 - "$archive" "$smoke" <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
              binary="$(find "$smoke" -name 'soonlnk.exe' -type f | head -n 1)"
              env -i SYSTEMROOT="${SYSTEMROOT:-C:\\Windows}" PATH=/usr/bin:/bin "$binary" --help >/dev/null
            else
              unzip -q "$archive" -d "$smoke"
              binary="$(find "$smoke" -name soonlnk -type f | head -n 1)"
              env -i HOME="$smoke" TMPDIR="$smoke" PATH=/usr/bin:/bin LANG=C LC_ALL=C "$binary" --help >/dev/null
            fi
            python3 - "${RUNNER_TEMP}/receipts/runtime-smoke.json" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"schema":"soonlink-runtime-smoke-receipt-v1","ok":True,"target":sys.argv[2],"sdkIndependentEnvironment":True,"command":"soonlnk --help"}, indent=2) + "\n")
          PY
          else
            python3 - "${RUNNER_TEMP}/receipts/runtime-smoke.json" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"schema":"soonlink-cross-link-receipt-v1","ok":True,"target":sys.argv[2],"runtimeSmokeVerified":False,"status":"cross-built-link-proof-only","nonClaims":["OHOS artifact was not executed on this runner"]}, indent=2) + "\n")
          PY
          fi

      - name: Upload receipts and release bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SoonLnk-${{ needs.metadata.outputs.package_version }}-${{ matrix.artifact_platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/receipts/*.json
            ${{ runner.temp }}/release-bundles/*.zip
            ${{ runner.temp }}/release-bundles/*.tar.gz
          if-no-files-found: warn
          compression-level: 0

  publish:
    needs: [metadata, bundles]
    if: ${{ needs.metadata.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SoonLnk-${{ needs.metadata.outputs.package_version }}-*
          path: dist/release-assets
          merge-multiple: true
      - name: Aggregate artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release-assets
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: dist/release-assets/*

  dispatch-homebrew-tap:
    needs: [metadata, publish]
    if: ${{ needs.metadata.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Homebrew tap publish
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH != '' && vars.HOMEBREW_TAP_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_REPO" || -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::warning::Skipping Homebrew tap dispatch because repository variables or token are not configured."
            exit 0
          fi
          payload="$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"], "inputs": {"release_tag": os.environ["RELEASE_TAG"], "tap_repo": os.environ["HOMEBREW_TAP_REPO"], "tap_branch": os.environ["TAP_BRANCH"]}}))')"
          curl --retry 3 --retry-delay 2 -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/homebrew-tap.yml/dispatches" \
            -d "$payload"
