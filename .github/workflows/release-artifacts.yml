name: Release Artifacts

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      publish_release:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or target release tag, for example 0.7.27.1
        required: false
        type: string
      publish_release:
        description: Publish verified bundles to GitHub Releases
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "features/hap-self-contained-release-*"
    tags:
      - "*.*.*"
      - "*.*.*.*"

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HAP_UPSTREAM_REF: 3dd69816af109d5da2378ee54cedb1311fa12842
  HAP_RELEASE_TAG: nightly-1.3.0-alpha.20260805010019-hap-3dd69816af10
  HAP_RELEASE_BASE: https://github.com/HapPub/Hap/releases/download/nightly-1.3.0-alpha.20260805010019-hap-3dd69816af10
  HAP_RAW_BASE: https://raw.githubusercontent.com/HapPub/Hap/3dd69816af109d5da2378ee54cedb1311fa12842/scripts/ci
  CANGJIE_SDK_MIRROR_BASE: https://github.com/HapPub/CangjieSDK-Mirror/releases/download
  # Keep SDK/stdx resolution on the same verified nightly as the pinned Hap release.
  CANGJIE_SDK_MIRROR_TAG: 1.3.0-alpha.20260805010019
  CANGJIE_STDX_GIT_REF: ${{ vars.CANGJIE_STDX_GIT_REF != '' && vars.CANGJIE_STDX_GIT_REF || 'v1.1.0-beta.25' }}
  CANGJIE_STDX_REPO: ${{ vars.CANGJIE_STDX_REPO != '' && vars.CANGJIE_STDX_REPO || 'https://gitcode.com/Cangjie/cangjie_stdx' }}
  CANGJIE_STDX_RELEASE_VERSION: ${{ vars.CANGJIE_STDX_RELEASE_VERSION }}
  IGNITE_GIT_URL: ${{ vars.IGNITE_GIT_URL != '' && vars.IGNITE_GIT_URL || 'https://github.com/Celading/Ignite.git' }}
  LISI_GIT_URL: ${{ vars.LISI_GIT_URL != '' && vars.LISI_GIT_URL || 'https://gitcode.com/cinyu/lisi.git' }}
  JINGUISSL_GIT_URL: ${{ vars.JINGUISSL_GIT_URL != '' && vars.JINGUISSL_GIT_URL || 'https://github.com/CangjieKu/JinGuiSSL.git' }}
  JINGUISSL_CORE_GIT_URL: ${{ vars.JINGUISSL_CORE_GIT_URL != '' && vars.JINGUISSL_CORE_GIT_URL || 'https://github.com/CangjieKu/JinGuiSSLCore.git' }}
  SEAJSON_GIT_URL: ${{ vars.SEAJSON_GIT_URL != '' && vars.SEAJSON_GIT_URL || 'https://gitcode.com/CjKu/SeaJson.git' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      sdk_tag: ${{ steps.meta.outputs.sdk_tag }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release matrix
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  version = "\(.*\)"/\1/p' cjpm.toml | head -n 1)"
          [[ -n "$version" ]] || { echo 'cjpm.toml version is missing' >&2; exit 1; }
          tag="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF_TYPE:-}" != tag ]]; then
            tag="${{ inputs.release_tag }}"
          fi
          [[ -n "$tag" ]] || tag="$version"
          tag="${tag#v}"
          [[ "$tag" == "$version" || "$tag" == "$version".* ]] || {
            echo "release tag $tag does not match package version $version" >&2
            exit 1
          }
          if [[ -z "${CANGJIE_SDK_MIRROR_TAG}" ]]; then
            curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
              'https://api.github.com/repos/HapPub/CangjieSDK-Mirror/releases?per_page=20' \
              -o "${RUNNER_TEMP}/cangjie-sdk-releases.json"
            CANGJIE_SDK_MIRROR_TAG="$(python3 - "${RUNNER_TEMP}/cangjie-sdk-releases.json" <<'PY'
          import json, sys
          releases = json.load(open(sys.argv[1], encoding='utf-8'))
          release = next((item for item in releases if not item.get('draft')), None)
          if not release:
              raise SystemExit('no published CangjieSDK-Mirror release found')
          print(release['tag_name'])
          PY
            )"
          fi
          publish='false'
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then publish='true'; fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${{ inputs.publish_release }}" == true ]]; then publish='true'; fi
          matrix='{"include":['
          matrix+='{ "runner":"ubuntu-24.04", "target":"x86_64-unknown-linux-gnu", "sdk_platform":"linux-x64", "stdx_platform":"linux-x64", "stdx_alias":"linux_x86_64_llvm", "artifact_platform":"Linux-x86_64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-linux-amd64.tar.gz", "hap_sha256":"a98e80f23b9a31aa52649daae745abee2a770d189d3991e2141e9a83f0756eb4" }'
          matrix+=',{"runner":"ubuntu-24.04-arm", "target":"aarch64-unknown-linux-gnu", "sdk_platform":"linux-aarch64", "stdx_platform":"linux-aarch64", "stdx_alias":"linux_aarch64_llvm", "artifact_platform":"Linux-aarch64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-linux-arm64.tar.gz", "hap_sha256":"4f020c03da4607d6a512cee3116658f583a69eac3736a7ae5d29e46689207d28" }'
          matrix+=',{"runner":"macos-15-intel", "target":"x86_64-apple-darwin", "sdk_platform":"mac-x64", "stdx_platform":"mac-x64", "stdx_alias":"cj_stdx_darwin_x86_64_llvm", "artifact_platform":"macOS-x86_64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-darwin-amd64.tar.gz", "hap_sha256":"7bb9475c28675bfb04f080ca0187158d7d1a0ac89f75f89e6cb4d4206d3abfe1" }'
          matrix+=',{"runner":"macos-14", "target":"aarch64-apple-darwin", "sdk_platform":"mac-aarch64", "stdx_platform":"mac-aarch64", "stdx_alias":"cj_stdx_darwin_aarch64_llvm", "artifact_platform":"macOS-aarch64", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-darwin-arm64.tar.gz", "hap_sha256":"8d6c5ac6489289ae4585cce7007d7716f7cb1bd5b964d78ec8e6954333226199" }'
          matrix+=',{"runner":"windows-2025", "target":"x86_64-w64-mingw32", "sdk_platform":"windows-x64", "stdx_platform":"windows-x64", "stdx_alias":"windows_x86_64_cjnative", "artifact_platform":"Windows-x86_64-exe", "runtime_smoke":"native", "hap_asset":"hap-0.1.0-windows-amd64.zip", "hap_sha256":"c9dcc49e6ea68f258c6ee16038e794c6fe7204ea74dfbd9c6cef15ca71896513" }'
          matrix+=',{"runner":"ubuntu-24.04", "target":"aarch64-linux-ohos", "sdk_platform":"linux-x64-ohos", "stdx_platform":"ohos-aarch64", "stdx_alias":"linux_ohos_aarch64_cjnative", "artifact_platform":"OHOS-aarch64", "runtime_smoke":"link-only", "ohos_arch":"arm64", "hap_asset":"hap-0.1.0-linux-amd64.tar.gz", "hap_sha256":"a98e80f23b9a31aa52649daae745abee2a770d189d3991e2141e9a83f0756eb4" }'
          matrix+=',{"runner":"ubuntu-24.04", "target":"x86_64-linux-ohos", "sdk_platform":"linux-x64-ohos", "stdx_platform":"ohos-x64", "stdx_alias":"linux_ohos_x86_64_cjnative", "artifact_platform":"OHOS-x86_64", "runtime_smoke":"link-only", "ohos_arch":"amd64", "hap_asset":"hap-0.1.0-linux-amd64.tar.gz", "hap_sha256":"a98e80f23b9a31aa52649daae745abee2a770d189d3991e2141e9a83f0756eb4" }'
          matrix+=']}'
          {
            echo "package_version=$version"
            echo "release_tag=$tag"
            echo "publish_release=$publish"
            echo "sdk_tag=$CANGJIE_SDK_MIRROR_TAG"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  bundles:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GitHub dependency projection
        shell: bash
        run: |
          set -euo pipefail
          deps_root="${RUNNER_TEMP}/soonlink-deps"
          workspace_root="${RUNNER_TEMP}/soonlink-release-workspace"
          mkdir -p "$deps_root"
          clone_dependency() {
            local url="$1"
            local destination="$2"
            git clone --depth 1 "$url" "$destination"
          }
          clone_dependency "$IGNITE_GIT_URL" "$deps_root/Ignite0500"
          clone_dependency "$LISI_GIT_URL" "$deps_root/lisi"
          clone_dependency "$JINGUISSL_GIT_URL" "$deps_root/jinguiSSL"
          clone_dependency "$JINGUISSL_CORE_GIT_URL" "$deps_root/JinguiCore"
          clone_dependency "$SEAJSON_GIT_URL" "$deps_root/SeaJson"
          sh ./scripts/prepare_release_workspace.sh \
            --output "$workspace_root" \
            --ignite "$deps_root/Ignite0500" \
            --lisi "$deps_root/lisi" \
            --jinguissl "$deps_root/jinguiSSL" \
            --jinguissl-core "$deps_root/JinguiCore" \
            --seajson "$deps_root/SeaJson"
          echo "SOONLINK_PROJECT_DIR=$workspace_root/SoonLink-Core" >> "$GITHUB_ENV"

      - name: Bootstrap pinned HapPub/Hap release asset
        id: hap
        shell: bash
        run: |
          set -euo pipefail
          hap_root="${RUNNER_TEMP}/hap"
          hap_archive="${RUNNER_TEMP}/${{ matrix.hap_asset }}"
          mkdir -p "$hap_root"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "${HAP_RELEASE_BASE}/${{ matrix.hap_asset }}" -o "$hap_archive"
          python3 - "${{ matrix.hap_sha256 }}" "$hap_archive" <<'PY'
          import hashlib, pathlib, sys
          expected, path = sys.argv[1:]
          actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Hap release checksum mismatch: expected={expected} actual={actual}")
          PY
          if [[ "$hap_archive" == *.zip ]]; then
            python3 - "$hap_archive" "$hap_root" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
          else
            tar -xzf "$hap_archive" -C "$hap_root"
          fi
          hap_bin="$(find "$hap_root" -type f \( -name hap -o -name hap.exe \) -print -quit)"
          [[ -n "$hap_bin" ]] || { echo 'pinned Hap release did not contain a Hap binary' >&2; exit 1; }
          chmod +x "$hap_bin"
          echo "$(dirname "$hap_bin")" >> "$GITHUB_PATH"
          "$hap_bin" version
          mkdir -p "${RUNNER_TEMP}/receipts"
          python3 - "${RUNNER_TEMP}/receipts/hap-bootstrap.json" "$hap_bin" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema": "soonlink-hap-bootstrap-receipt-v1",
              "ok": True,
              "upstreamCommit": "3dd69816af109d5da2378ee54cedb1311fa12842",
              "releaseTag": "nightly-1.3.0-alpha.20260805010019-hap-3dd69816af10",
              "asset": "${{ matrix.hap_asset }}",
              "sha256": "${{ matrix.hap_sha256 }}",
              "binary": sys.argv[2]
          }, indent=2) + "\n")
          PY
          echo "hap_bin=$hap_bin" >> "$GITHUB_OUTPUT"

      - name: Hap action-doctor (read-only)
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
        run: |
          set -euo pipefail
          "$HAP_BIN" ci action-doctor \
            --workflow .github/workflows/release-artifacts.yml \
            --target "${{ matrix.target }}" | tee "${RUNNER_TEMP}/action-doctor.json"
          python3 - "${RUNNER_TEMP}/action-doctor.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not data.get("ok"):
              raise SystemExit("Hap action-doctor rejected the release workflow")
          PY

      - name: Fetch pinned Hap CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ci_dir="${RUNNER_TEMP}/hap-ci"
          mkdir -p "$ci_dir"
          for script in bootstrap-cangjie-from-mirror.sh resolve-nightly-sdk.py install-cangjie-sdk.sh safe-extract-sdk.py; do
            curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
              "${HAP_RAW_BASE}/${script}" -o "$ci_dir/$script"
          done
          chmod +x "$ci_dir"/*.sh
          echo "ci_dir=$ci_dir" >> "$GITHUB_ENV"

      - name: Resolve target SDK with the mirror manifest
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/manifest.v1.json"
          mkdir -p "${RUNNER_TEMP}/cangjie" "${RUNNER_TEMP}/receipts"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "${CANGJIE_SDK_MIRROR_BASE}/${{ needs.metadata.outputs.sdk_tag }}/manifest.v1.json" \
            -o "$manifest"
          bootstrap_log="${RUNNER_TEMP}/receipts/sdk-bootstrap.log"
          set +e
          bash "$ci_dir/bootstrap-cangjie-from-mirror.sh" \
            "$manifest" \
            "${{ matrix.sdk_platform }}" \
            "${RUNNER_TEMP}/cangjie" \
            "${RUNNER_TEMP}/cangjie-env.sh" \
            "${RUNNER_TEMP}/receipts/sdk-resolution.json" 2>&1 | tee "$bootstrap_log"
          bootstrap_status=${PIPESTATUS[0]}
          set -e
          if [[ "$bootstrap_status" -ne 0 ]]; then
            python3 - "$bootstrap_log" "$bootstrap_status" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          status = sys.argv[2]
          message = log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink SDK bootstrap failed::exit={status}; {message}")
          PY
            exit "$bootstrap_status"
          fi
          stdx_asset="$(python3 - "$manifest" "${{ matrix.stdx_platform }}" <<'PY'
          import json, sys
          manifest, platform = sys.argv[1:]
          prefix = f"cangjie-stdx-{platform}-"
          matches = [item["name"] for item in json.load(open(manifest, encoding="utf-8"))["assets"]
                     if item.get("classification") == "stdx" and item["name"].startswith(prefix) and item["name"].endswith(".zip")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one stdx asset for {platform}, got {matches}")
          print(matches[0])
          PY
          )"
          set +e
          python3 "$ci_dir/resolve-nightly-sdk.py" \
            --manifest "$manifest" \
            --asset-name "$stdx_asset" \
            > "${RUNNER_TEMP}/receipts/stdx-resolution.json" 2> "${RUNNER_TEMP}/receipts/stdx-resolution.log"
          stdx_status=$?
          set -e
          if [[ "$stdx_status" -ne 0 ]]; then
            python3 - "${RUNNER_TEMP}/receipts/stdx-resolution.log" "$stdx_status" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          status = sys.argv[2]
          message = log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink stdx resolution failed::exit={status}; {message}")
          PY
            exit "$stdx_status"
          fi
          cat "${RUNNER_TEMP}/receipts/sdk-resolution.json"
          cat "${RUNNER_TEMP}/receipts/stdx-resolution.json"

      - name: Source generated Cangjie environment
        shell: bash
        run: |
          set -euo pipefail
          # The mirror installer writes cangjie-env.sh; no shell rc is modified.
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          echo "CANGJIE_HOME=$CANGJIE_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          if [[ -n "${LD_LIBRARY_PATH:-}" ]]; then
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi
          if [[ -n "${DYLD_LIBRARY_PATH:-}" ]]; then
            echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi
          if [[ "${RUNNER_OS:-}" == macOS ]]; then
            sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
            [[ -d "$sdkroot" ]] || { echo "macOS SDKROOT is unavailable: $sdkroot" >&2; exit 1; }
            echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
          fi

      - name: Install OpenHarmony native sysroot
        id: ohos
        if: ${{ matrix.runtime_smoke == 'link-only' }}
        uses: openharmony-rs/setup-ohos-sdk@eb82b94ef522b07269679195c2512f22e922ef3b
        with:
          version: "6.1"
          components: native
          cache: "true"
          mirror: "true"

      - name: Install exact stdx asset and prepare OpenHarmony sysroot
        shell: bash
        run: |
          set -euo pipefail
          stdx_root="${RUNNER_TEMP}/cangjie_stdx"
          stdx_archive="${RUNNER_TEMP}/stdx-${{ matrix.stdx_platform }}.zip"
          mkdir -p "$stdx_root"
          stdx_url="$(python3 - "${RUNNER_TEMP}/receipts/stdx-resolution.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["sdkUrl"])
          PY
          )"
          stdx_sha256="$(python3 - "${RUNNER_TEMP}/receipts/stdx-resolution.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["sdkSha256"])
          PY
          )"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "$stdx_url" -o "$stdx_archive"
          python3 - "$stdx_sha256" "$stdx_archive" <<'PY'
          import hashlib, pathlib, sys
          expected, path = sys.argv[1:]
          actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"stdx checksum mismatch: expected={expected} actual={actual}")
          PY
          python3 "$ci_dir/safe-extract-sdk.py" "$stdx_archive" "$stdx_root"
          python3 - "$stdx_root" "${{ matrix.stdx_alias }}" "${RUNNER_TEMP}/receipts/stdx-install.json" <<'PY'
          import json, pathlib, shutil, sys
          root, alias, receipt = map(pathlib.Path, sys.argv[1:])
          candidates = sorted(path.parent.parent for path in root.glob("*/static/stdx") if path.is_dir())
          if len(candidates) != 1:
              raise SystemExit(f"expected one extracted stdx root, got {candidates}")
          source = candidates[0]
          target = root / alias
          if source != target:
              try:
                  target.symlink_to(source.name, target_is_directory=True)
              except OSError:
                  shutil.copytree(source, target)
          if not (target / "static" / "stdx").is_dir():
              raise SystemExit(f"stdx alias is incomplete: {target}")
          pathlib.Path(receipt).write_text(json.dumps({
              "schema": "soonlink-stdx-install-receipt-v1",
              "ok": True,
              "sourceRoot": str(source),
              "alias": str(target),
              "target": "${{ matrix.target }}",
              "manifestSelected": True
          }, indent=2) + "\n")
          PY
          echo "CANGJIE_STDX_PATH=$stdx_root" >> "$GITHUB_ENV"
          if [[ "${{ matrix.runtime_smoke }}" == link-only ]]; then
            ohos_native_sysroot="${{ steps.ohos.outputs.ohos_sdk_native }}"
            [[ -d "$ohos_native_sysroot" ]] || { echo "OpenHarmony native sysroot is required: $ohos_native_sysroot" >&2; exit 1; }
            # The mirror Cangjie SDK remains the compiler/toolchain root. The
            # OpenHarmony native sysroot is a separate link-only input.
            [[ -d "${CANGJIE_HOME:-}" ]] || { echo 'Cangjie SDK root is required for OpenHarmony targets' >&2; exit 1; }
            echo "OHOS_NATIVE_SYSROOT=$ohos_native_sysroot" >> "$GITHUB_ENV"
            echo "DEVECO_OH_NATIVE_HOME=$ohos_native_sysroot" >> "$GITHUB_ENV"
            echo "DEVECO_CANGJIE_HOME=$CANGJIE_HOME" >> "$GITHUB_ENV"
            python3 - "${RUNNER_TEMP}/receipts/ohos-sysroot.json" "$ohos_native_sysroot" "$CANGJIE_HOME" <<'PY'
          import json, pathlib, sys
          receipt, native_sysroot, cangjie_home = sys.argv[1:]
          pathlib.Path(receipt).write_text(json.dumps({
              "schema": "soonlink-ohos-sysroot-boundary-receipt-v1",
              "ok": True,
              "nativeSysroot": native_sysroot,
              "cangjieSdkRoot": cangjie_home,
              "separateInputs": True,
              "runtimeClaim": "link-only"
          }, indent=2) + "\n")
          PY
          fi

      - name: Install native packaging tools
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends patchelf unzip zip

      - name: Project temporary manifests to the exact target
        shell: bash
        run: |
          set -euo pipefail
          projection_args=(
            --root "$(dirname "$SOONLINK_PROJECT_DIR")"
            --target "${{ matrix.target }}"
            --receipt "${RUNNER_TEMP}/receipts/exact-target-projection.json"
            --stdx-alias "${{ matrix.stdx_alias }}"
          )
          if [[ "${{ matrix.runtime_smoke }}" == link-only ]]; then
            arch="x86_64"
            if [[ "${{ matrix.target }}" == aarch64-* ]]; then
              arch="aarch64"
            fi
            cangjie_llvm_bin="${CANGJIE_HOME}/third_party/llvm/bin"
            ohos_llvm_bin="${OHOS_NATIVE_SYSROOT}/llvm/bin"
            ohos_sysroot="${OHOS_NATIVE_SYSROOT}/sysroot"
            [[ -d "$cangjie_llvm_bin" ]] || { echo "Cangjie LLVM bin not found: $cangjie_llvm_bin" >&2; exit 1; }
            [[ -d "$ohos_llvm_bin" ]] || { echo "OpenHarmony LLVM bin not found: $ohos_llvm_bin" >&2; exit 1; }
            [[ -d "$ohos_sysroot" ]] || { echo "OpenHarmony sysroot not found: $ohos_sysroot" >&2; exit 1; }
            ohos_target_lib="${ohos_sysroot}/usr/lib/${arch}-linux-ohos"
            [[ -d "$ohos_target_lib" ]] || { echo "OpenHarmony target library not found: $ohos_target_lib" >&2; exit 1; }
            ohos_llvm_target_lib="$(python3 - "${OHOS_NATIVE_SYSROOT}/llvm/lib/clang" "${arch}-linux-ohos" <<'PY'
          import pathlib, sys
          root, target = pathlib.Path(sys.argv[1]), sys.argv[2]
          candidates = sorted(root.glob(f"*/lib/{target}"))
          if candidates:
              print(candidates[0])
          PY
            )"
            [[ -n "$ohos_llvm_target_lib" ]] || { echo "OpenHarmony LLVM target library not found" >&2; exit 1; }
            projection_args+=(
              --cangjie-llvm-bin "$cangjie_llvm_bin"
              --ohos-llvm-bin "$ohos_llvm_bin"
              --ohos-sysroot "$ohos_sysroot"
              --ohos-target-lib "$ohos_target_lib"
              --ohos-llvm-target-lib "$ohos_llvm_target_lib"
            )
          fi
          python3 "$GITHUB_WORKSPACE/scripts/ci/project_exact_target_manifest.py" "${projection_args[@]}"

      - name: Run Hap stdx/runtime probes
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/receipts"
          "$HAP_BIN" doctor stdx --project "$SOONLINK_PROJECT_DIR" --target "${{ matrix.target }}" > "${RUNNER_TEMP}/receipts/stdx-probe.json"
          "$HAP_BIN" doctor runtime --project "$SOONLINK_PROJECT_DIR" --target "${{ matrix.target }}" > "${RUNNER_TEMP}/receipts/runtime-probe.json"

      - name: Generate and execute reviewed Hap project bridge
        if: ${{ matrix.runtime_smoke == 'native' }}
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
          HAP_REVIEW_TOKEN: reviewed-${{ github.sha }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          bridge_args=(
            --project "$SOONLINK_PROJECT_DIR"
            --receipt "${RUNNER_TEMP}/receipts/project-bridge.json"
            --recipe-output "${RUNNER_TEMP}/project-bridge.sh"
            --review-token "$HAP_REVIEW_TOKEN"
          )
          if [[ "${{ matrix.target }}" != *-w64-mingw32 ]]; then
            bridge_args+=(--run-tests)
            echo 'reviewed Hap bridge contract: cjpm build; cjpm test'
          else
            echo 'reviewed Hap bridge contract: cjpm build; serialized cjpm test follows'
          fi
          "$HAP_BIN" ci project-bridge-recipe "${bridge_args[@]}" \
            > "${RUNNER_TEMP}/receipts/project-bridge-plan.json"
          chmod +x "${RUNNER_TEMP}/project-bridge.sh"
          bridge_log="${RUNNER_TEMP}/receipts/project-bridge.log"
          set +e
          bash "${RUNNER_TEMP}/project-bridge.sh" 2>&1 | tee "$bridge_log"
          bridge_status=${PIPESTATUS[0]}
          set -e
          if [[ "$bridge_status" -ne 0 ]]; then
            python3 - "$bridge_log" <<'PY'
          import pathlib, sys
          tail = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-4000:]
          message = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink project bridge failed::{message}")
          PY
            exit "$bridge_status"
          fi

      - name: Run serialized Windows tests
        if: ${{ matrix.target == 'x86_64-w64-mingw32' }}
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          test_log="${RUNNER_TEMP}/receipts/windows-test.log"
          test_receipt="${RUNNER_TEMP}/receipts/windows-test.json"
          set +e
          (cd "$SOONLINK_PROJECT_DIR" && cjpm test --jobs 1 --parallel 1 --no-progress) 2>&1 | tee "$test_log"
          test_status=${PIPESTATUS[0]}
          set -e
          python3 - "$test_receipt" "$test_log" "$test_status" <<'PY'
          import json, pathlib, sys
          receipt, log_path, status = sys.argv[1:]
          log = pathlib.Path(log_path).read_text(errors="replace")
          pathlib.Path(receipt).write_text(json.dumps({
              "schema": "soonlink-windows-serialized-test-receipt-v1",
              "ok": status == "0",
              "target": "x86_64-w64-mingw32",
              "exitCode": int(status),
              "command": "cjpm test --jobs 1 --parallel 1 --no-progress",
              "reason": "avoid hosted Windows unittest worker result merge drift",
              "output": log[-12000:]
          }, indent=2) + "\n")
          PY
          if [[ "$test_status" -ne 0 ]]; then
            python3 - "$test_log" "$test_status" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          message = log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink serialized Windows tests failed::exit={sys.argv[2]}; {message}")
          PY
            exit "$test_status"
          fi

      - name: Record OHOS test boundary
        if: ${{ matrix.runtime_smoke == 'link-only' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/receipts/project-bridge.json" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "schema": "soonlink-cross-test-boundary-receipt-v1",
              "ok": True,
              "target": sys.argv[2],
              "buildActionTaken": False,
              "testActionTaken": False,
              "status": "runtime-test-not-available-on-hosted-cross-runner",
              "nonClaims": ["OHOS link proof is not target runtime test proof"]
          }, indent=2) + "\n")
          PY

      - name: Build exact target with Hap
        id: build
        shell: bash
        env:
          HAP_BIN: ${{ steps.hap.outputs.hap_bin }}
        run: |
          set -euo pipefail
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          build_log="${RUNNER_TEMP}/receipts/hap-build.log"
          build_receipt="${RUNNER_TEMP}/receipts/hap-build.json"
          set +e
          "$HAP_BIN" build --project "$SOONLINK_PROJECT_DIR" --target "${{ matrix.target }}" --verbose 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          python3 - "$build_receipt" "$build_log" "$build_status" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          receipt, log_path, status, target = sys.argv[1:]
          log = pathlib.Path(log_path).read_text(errors="replace")
          pathlib.Path(receipt).write_text(json.dumps({
              "schema": "soonlink-hap-exact-target-build-receipt-v1",
              "ok": status == "0",
              "target": target,
              "exitCode": int(status),
              "hapOutput": log[-12000:],
              "source": "Hap build exit status plus preserved output",
          }, indent=2) + "\n")
          PY
          if [[ "$build_status" -ne 0 ]]; then
            python3 - "$build_log" "$build_status" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          message = log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink Hap exact-target build failed::exit={sys.argv[2]}; {message}")
          PY
            exit "$build_status"
          fi

      - name: Package binary and WebPanel together
        id: package
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "${RUNNER_TEMP}/cangjie-env.sh"
          set -u
          binary="$(python3 - "$SOONLINK_PROJECT_DIR/target" "${{ matrix.target }}" <<'PY'
          import pathlib, sys

          root, target = map(pathlib.Path, sys.argv[1:])
          names = {"main", "main.exe"}
          candidates = [
              path for path in root.rglob("*")
              if path.is_file() and path.name in names
          ]
          if not candidates:
              raise SystemExit(f"target binary not found below {root}")

          def rank(path):
              parts = path.parts
              score = 100
              if path.parent == root / "release" / "bin":
                  score = 0
              elif path.parent == root / str(target) / "release" / "bin":
                  score = 1
              elif path.parent.name == "bin" and path.parent.parent.name == "release":
                  score = 2
              if path.name == "main.exe":
                  score += 1
              return score, len(parts), str(path)

          print(min(candidates, key=rank))
          PY
          )"
          [[ -f "$binary" ]] || { echo "target binary not found: $binary" >&2; exit 1; }
          echo "Packaging binary: $binary"
          chmod +x "$SOONLINK_PROJECT_DIR/scripts/ci/package_release_bundle.sh"
          package_log="${RUNNER_TEMP}/receipts/package.log"
          set +e
          "$SOONLINK_PROJECT_DIR/scripts/ci/package_release_bundle.sh" \
            --root "$SOONLINK_PROJECT_DIR" \
            --binary "$binary" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.metadata.outputs.package_version }}" \
            --output-dir "${RUNNER_TEMP}/release-bundles" \
            --runtime-root "${CANGJIE_HOME}" 2>&1 | tee "$package_log"
          package_status=${PIPESTATUS[0]}
          set -e
          if [[ "$package_status" -ne 0 ]]; then
            python3 - "$package_log" "$package_status" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          message = log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=SoonLink release packaging failed::exit={sys.argv[2]}; {message}")
          PY
            exit "$package_status"
          fi
          mkdir -p "${RUNNER_TEMP}/receipts"
          python3 - "${RUNNER_TEMP}/receipts/package-receipt.json" "${RUNNER_TEMP}/release-bundles" <<'PY'
          import hashlib, json, pathlib, sys
          receipt, directory = map(pathlib.Path, sys.argv[1:])
          archives = sorted(directory.glob("*.zip")) + sorted(directory.glob("*.tar.gz"))
          if len(archives) != 2:
              raise SystemExit("package did not produce one zip and one tar.gz")
          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""): h.update(chunk)
              return h.hexdigest()
          payload = {"schema":"soonlink-package-receipt-v1", "ok":True, "target":"${{ matrix.target }}", "archives":[{"name":p.name,"sha256":sha(p)} for p in archives], "webpanelIncluded":True}
          receipt.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Native runtime smoke or OHOS link-only proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/receipts"
          if [[ "${{ matrix.runtime_smoke }}" == native ]]; then
            archive="$(find "${RUNNER_TEMP}/release-bundles" -name '*.zip' -maxdepth 1 | head -n 1)"
            smoke="${RUNNER_TEMP}/runtime-smoke"
            rm -rf "$smoke"; mkdir -p "$smoke"
            if [[ "${{ matrix.target }}" == *-w64-mingw32 ]]; then
              python3 - "$archive" "$smoke" <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
              binary="$(find "$smoke" -name 'soonlnk.exe' -type f | head -n 1)"
              env -i SYSTEMROOT="${SYSTEMROOT:-C:\\Windows}" PATH=/usr/bin:/bin "$binary" --help >/dev/null
            else
              unzip -q "$archive" -d "$smoke"
              binary="$(find "$smoke" -name soonlnk -type f | head -n 1)"
              env -i HOME="$smoke" TMPDIR="$smoke" PATH=/usr/bin:/bin LANG=C LC_ALL=C "$binary" --help >/dev/null
            fi
            python3 - "${RUNNER_TEMP}/receipts/runtime-smoke.json" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"schema":"soonlink-runtime-smoke-receipt-v1","ok":True,"target":sys.argv[2],"sdkIndependentEnvironment":True,"command":"soonlnk --help"}, indent=2) + "\n")
          PY
          else
            python3 - "${RUNNER_TEMP}/receipts/runtime-smoke.json" "${{ matrix.target }}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"schema":"soonlink-cross-link-receipt-v1","ok":True,"target":sys.argv[2],"runtimeSmokeVerified":False,"status":"cross-built-link-proof-only","nonClaims":["OHOS artifact was not executed on this runner"]}, indent=2) + "\n")
          PY
          fi

      - name: Upload receipts and release bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SoonLnk-${{ needs.metadata.outputs.package_version }}-${{ matrix.artifact_platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/receipts/*.json
            ${{ runner.temp }}/receipts/*.log
            ${{ runner.temp }}/release-bundles/*.zip
            ${{ runner.temp }}/release-bundles/*.tar.gz
          if-no-files-found: warn
          compression-level: 0

  publish:
    needs: [metadata, bundles]
    if: ${{ needs.metadata.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SoonLnk-${{ needs.metadata.outputs.package_version }}-*
          path: dist/release-assets
          merge-multiple: true
      - name: Aggregate artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release-assets
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: dist/release-assets/*

  dispatch-homebrew-tap:
    needs: [metadata, publish]
    if: ${{ needs.metadata.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Homebrew tap publish
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH != '' && vars.HOMEBREW_TAP_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_REPO" || -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::warning::Skipping Homebrew tap dispatch because repository variables or token are not configured."
            exit 0
          fi
          payload="$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"], "inputs": {"release_tag": os.environ["RELEASE_TAG"], "tap_repo": os.environ["HOMEBREW_TAP_REPO"], "tap_branch": os.environ["TAP_BRANCH"]}}))')"
          curl --retry 3 --retry-delay 2 -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/homebrew-tap.yml/dispatches" \
            -d "$payload"
